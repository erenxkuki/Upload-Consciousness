[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upload-consciousness"
version = "0.1.0"
description = "UCC - Unified Continuity Core: experimental research platform for digital human continuity."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Research/Educational - see LICENSE" }
authors = [{ name = "Upload Consciousness Research" }]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "argon2-cffi>=23.1",
  "typer>=0.12",
  "httpx>=0.27",
  "structlog>=24.1",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "rich>=13.7",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.2"]
redis = ["redis>=5.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.scripts]
ucc = "interfaces.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "biological_systems*", "mind*", "embodiment*", "digital_world*", "autonomy*", "distributed*", "storage*", "research*", "security*", "interfaces*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001"]
